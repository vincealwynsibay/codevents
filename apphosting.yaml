# Firebase App Hosting config. https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 4

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  # Public URL, used on posters, QR codes and link previews (no trailing slash).
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://REPLACE_ME.web.app
    availability: [BUILD, RUNTIME]
  - variable: OWNER_EMAILS
    value: REPLACE_ME@umindanao.edu.ph
    availability: [RUNTIME]
  # Optional image uploads. Create the secret with:
  #   firebase apphosting:secrets:set cloudinary-url
  # - variable: CLOUDINARY_URL
  #   secret: cloudinary-url
  #   availability: [RUNTIME]
